<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宋 · 部署工作台</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/app.js" defer></script></head>
<body>
<header><a class="brand" href="#/">宋 <span>DEPLOY</span></a><div class="header-right"><span id="identity"></span><button id="logout" class="quiet" hidden>退出</button></div></header>
<main>
<p id="message" role="status" hidden></p>
<section id="login-panel" class="panel login" hidden><span class="eyebrow">YOUR PROJECTS, IN ONE PLACE</span><h1>登录部署工作台</h1><p>从仓库到预览，在这里管理你的项目。</p><form id="login-form"><label>账号<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary full" type="submit">登录</button></form></section>
<div id="workspace" hidden></div>
</main>
<dialog id="account-dialog"><div class="section-head"><h2>访问账号</h2><button id="close-accounts" aria-label="关闭">关闭</button></div><p class="hint">这些账号仅用于查看你授权的项目，不能管理部署。</p><div id="account-list"></div><form id="account-form"><label>新账号<input name="username" autocomplete="off" pattern="[a-zA-Z0-9][a-zA-Z0-9@._-]{2,79}" placeholder="例如 tester 或邮箱" required></label><label>密码<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="至少 12 位" required></label><p id="account-message" role="status"></p><button class="primary" type="submit">创建账号</button></form></dialog>
</body></html>
