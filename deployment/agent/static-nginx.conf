server {
    root /usr/share/nginx/html;
    index index.html index.htm;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Entry HTML must never keep a previous deployment (including nginx's default page).
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html /index.htm =404;
    }
    location ~* \.html?$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # Revalidate stable asset URLs using ETag/Last-Modified after deployments.
    location / {
        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
    }
}
